name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan PR diff for secrets
        run: |
          python3 .claude/skills/github-push/scripts/scan_secrets.py \
            --repo . \
            --diff-against "${{ github.event.pull_request.base.sha }}"

  test-suite:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Once modules have their own requirements.txt (per the folder
          # rules -- each module is self-contained), install those here too,
          # e.g.: pip install -r modules/pricing-engine/requirements.txt

      - name: Run test suite
        run: pytest
        # Runs the full suite in CI, unlike the github-push skill's local
        # pre-commit check, which scopes pytest to the touched module for
        # speed. CI is where the full, unscoped run belongs -- it's not
        # time-pressured the way an interactive commit is, and it's the
        # actual safety net.
